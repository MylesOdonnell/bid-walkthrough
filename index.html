<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busy Bidder</title>
<meta name="description" content="Walk a building, tap in each room, and get the square footage and labor hours for the bid.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Busy Bidder">
<link rel="apple-touch-icon" href="icon-180.png">
<script>try{var t=localStorage.getItem("mod_bid_theme_v1");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
</head>
<body>
<style>
:root{
  --ground:#F1F3EF; --surface:#FFFFFF; --surface-2:#E7EBE4; --surface-3:#DDE2D9;
  --ink:#151A17; --ink-2:#4C554F; --muted:#6E7872;
  --line:#D6DBD3; --line-strong:#B9C0B5;
  --accent:#14606A; --accent-ink:#0E4A52; --accent-soft:#DCEAEB;
  --signal:#F0C02B; --signal-ink:#3A2E05; --signal-soft:#FAEDC4;
  --ok:#2C7A4B; --warn:#A9640F; --crit:#AE2F29;
  --shadow-1:0 1px 2px rgba(21,26,23,.07);
  --shadow-2:0 2px 4px rgba(21,26,23,.06), 0 14px 30px -18px rgba(21,26,23,.35);
  --r:10px; --r-lg:14px;
  --tap:46px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1311; --surface:#181D1A; --surface-2:#212823; --surface-3:#2A322C;
    --ink:#E9EDE7; --ink-2:#B4BDB6; --muted:#8A948C;
    --line:#2A322C; --line-strong:#3D463F;
    --accent:#4FB6C0; --accent-ink:#93DBE1; --accent-soft:#12312F;
    --signal:#FFD152; --signal-ink:#2A2005; --signal-soft:#3A2F0C;
    --ok:#55B77C; --warn:#E0982F; --crit:#E4655C;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.35), 0 14px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1311; --surface:#181D1A; --surface-2:#212823; --surface-3:#2A322C;
  --ink:#E9EDE7; --ink-2:#B4BDB6; --muted:#8A948C;
  --line:#2A322C; --line-strong:#3D463F;
  --accent:#4FB6C0; --accent-ink:#93DBE1; --accent-soft:#12312F;
  --signal:#FFD152; --signal-ink:#2A2005; --signal-soft:#3A2F0C;
  --ok:#55B77C; --warn:#E0982F; --crit:#E4655C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.35), 0 14px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0; font-family:"Barlow Condensed", "Barlow Semi Condensed", ui-sans-serif, sans-serif; font-weight:700; text-wrap:balance; letter-spacing:.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
input,textarea,select{
  width:100%; background:var(--surface); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:var(--r);
  padding:10px 12px; min-height:var(--tap);
}
textarea{min-height:88px; resize:vertical; line-height:1.4}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:600px; margin:0 auto; padding:0 14px}
.screen{display:none}
.screen.on{display:flex; flex-direction:column; min-height:calc(100dvh - 57px)}

.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-1);
}
.topbar-in{display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 0}
.brandmark{
  font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:13px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:8px;
}
.brandmark .rule{display:block; width:22px; height:3px; background:var(--signal); border-radius:2px}
.topbar h1{font-size:22px; line-height:1.1; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.iconbtn{
  min-width:var(--tap); min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r); color:var(--ink-2); font-size:15px; font-weight:600;
}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:0 16px; border-radius:var(--r);
  font-weight:600; border:1px solid transparent; text-align:center;
}
.btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.btn-primary{background:var(--signal); color:var(--signal-ink); box-shadow:var(--shadow-1)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-solid{background:var(--accent); color:#fff}
:root[data-theme="dark"] .btn-solid{color:#08201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-solid{color:#08201F}}
.btn-ghost{border-color:var(--line-strong); background:var(--surface); color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{border-color:var(--crit); color:var(--crit); background:transparent}
.btn-danger:hover{background:var(--crit); color:#fff}
.btn-block{display:flex; width:100%}
.btn-sm{min-height:38px; padding:0 12px; font-size:14px}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-1)}
.stack{display:flex; flex-direction:column; gap:12px}
.stack-sm{display:flex; flex-direction:column; gap:8px}
.row{display:flex; align-items:center; gap:10px}
.grow{flex:1; min-width:0}

.eyebrow{
  font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:13px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.section{display:flex; flex-direction:column; gap:10px; margin:22px 0}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}

label.field{display:flex; flex-direction:column; gap:5px}
label.field > span{font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:.01em}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}

/* ---------- totals ---------- */
.totals{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden;
}
.tot{background:var(--surface); padding:11px 12px; display:flex; flex-direction:column; gap:1px}
.tot .k{font-family:"Barlow Condensed",sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tot .v{font-family:"Barlow Condensed",sans-serif; font-size:26px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums}
.tot .u{font-size:12px; color:var(--muted); font-weight:500}
.tot.hl{background:var(--signal-soft)}

/* ---------- chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:7px 12px; font-size:14px; font-weight:500; min-height:38px;
  display:inline-flex; align-items:center;
}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08201F}}

/* ---------- pills ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:2px 9px; font-size:12px; font-weight:600; letter-spacing:.02em;
  border:1px solid var(--line-strong); color:var(--ink-2); background:var(--surface-2);
}
.pill.ok{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); background:color-mix(in srgb, var(--ok) 12%, transparent)}
.pill.warn{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); background:color-mix(in srgb, var(--warn) 12%, transparent)}
.pill.crit{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 40%, transparent); background:color-mix(in srgb, var(--crit) 12%, transparent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}

/* ---------- walkthrough list ---------- */
.wt-item{
  display:flex; align-items:stretch; gap:0; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-1); overflow:hidden;
}
.wt-item:hover{border-color:var(--line-strong)}
.wt-rail{width:5px; flex:none; background:var(--line-strong)}
.wt-item[data-synced="yes"] .wt-rail{background:var(--ok)}
.wt-item[data-synced="no"] .wt-rail{background:var(--signal)}
.wt-body{padding:12px 14px; flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.wt-name{font-family:"Barlow Condensed",sans-serif; font-size:21px; font-weight:700; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wt-meta{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.wt-meta b{color:var(--ink-2); font-weight:600}

/* ---------- room rows ---------- */
.room{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-1); overflow:hidden}
.room.open{border-color:var(--accent); box-shadow:var(--shadow-2)}
.room-head{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; min-height:56px}
.room-idx{
  flex:none; width:30px; height:30px; border-radius:8px; background:var(--surface-2);
  display:grid; place-items:center; font-family:"Barlow Condensed",sans-serif; font-weight:700;
  font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.room.open .room-idx{background:var(--accent); color:#fff}
:root[data-theme="dark"] .room.open .room-idx{color:#08201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .room.open .room-idx{color:#08201F}}
.room-title{font-weight:600; font-size:16px; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.room-sub{font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 9px; font-variant-numeric:tabular-nums}
.room-hrs{flex:none; text-align:right; font-family:"Barlow Condensed",sans-serif; font-variant-numeric:tabular-nums}
.room-hrs .n{font-size:19px; font-weight:700; line-height:1}
.room-hrs .l{font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-weight:600}
.caret{flex:none; width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; transition:transform .18s ease}
.room.open > .room-head > .caret{transform:rotate(180deg)}
.room-detail{border-top:1px dashed var(--line-strong); padding:14px 12px; display:flex; flex-direction:column; gap:14px}

.sqft-row{display:grid; grid-template-columns:1fr auto 1fr auto 1.2fr; align-items:end; gap:7px}
.sqft-row .x{padding-bottom:12px; color:var(--muted); font-weight:600}
.sqft-out{
  display:flex; flex-direction:column; gap:5px;
}
.sqft-out .box{
  min-height:var(--tap); border-radius:var(--r); border:1px solid var(--line-strong);
  background:var(--surface-2); display:flex; align-items:center; justify-content:flex-end;
  padding:0 12px; font-weight:700; font-variant-numeric:tabular-nums;
}

/* ---------- steppers ---------- */
.fixgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:7px}
.fix{display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--surface-2); border-radius:var(--r); padding:5px 6px 5px 12px}
.fix .fl{flex:1; min-width:0; font-size:14px; font-weight:500; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fix .fv{width:30px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; border-top:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong); align-self:stretch; display:grid; place-items:center; background:var(--surface)}
input.fv{width:52px; min-height:0; padding:0 2px; border-radius:0; border-left:0; border-right:0; -moz-appearance:textfield}
input.fv::-webkit-outer-spin-button, input.fv::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.fix .stepper{display:flex; align-items:stretch; flex:none}
.stp{width:34px; height:36px; border:1px solid var(--line-strong); background:var(--surface); font-size:19px; font-weight:600; line-height:1; display:grid; place-items:center; color:var(--ink-2)}
.stp:first-child{border-radius:8px 0 0 8px}
.stp:last-child{border-radius:0 8px 8px 0}
.stp:hover{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent)}

/* ---------- photos ---------- */
.photos{display:flex; flex-wrap:wrap; gap:8px}
.photo{position:relative; width:74px; height:74px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line-strong); background:var(--surface-2)}
.photo img{width:100%; height:100%; object-fit:cover; display:block}
.photo button{
  position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%;
  background:rgba(0,0,0,.66); color:#fff; font-size:13px; line-height:1; display:grid; place-items:center;
}
.addphoto{
  width:74px; height:74px; border-radius:var(--r); border:1.5px dashed var(--line-strong);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
}
.addphoto:hover{border-color:var(--accent); color:var(--accent)}
.addphoto svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8}

/* ---------- sheet ---------- */
.sheet{position:fixed; inset:0; z-index:90; display:none}
.sheet.on{display:block}
.sheet-scrim{position:absolute; inset:0; background:rgba(10,14,12,.55)}
.sheet-panel{
  position:absolute; left:0; right:0; bottom:0; top:0;
  background:var(--ground); display:flex; flex-direction:column;
}
.sheet-head h1{flex:1; min-width:0}
.sheet-head{
  background:var(--surface); border-bottom:1px solid var(--line); flex:none;
  padding-top:env(safe-area-inset-top);
}
.sheet-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:28px}
.sheet-foot{flex:none; background:var(--surface); border-top:1px solid var(--line); padding:10px 0 calc(10px + env(safe-area-inset-bottom))}

.cat{margin:18px 0 8px}
.typelist{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.type{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r);
  padding:11px 12px; text-align:left; font-size:15px; font-weight:500; min-height:var(--tap);
  display:flex; align-items:center; box-shadow:var(--shadow-1);
}
.type:hover{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

/* ---------- misc ---------- */
.bottombar{
  position:sticky; bottom:0; margin-top:auto; z-index:30; background:var(--surface);
  border-top:1px solid var(--line); padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.empty{text-align:center; color:var(--muted); padding:34px 18px; border:1.5px dashed var(--line-strong); border-radius:var(--r-lg)}
.empty h3{font-size:19px; color:var(--ink-2); margin-bottom:4px}
.note{font-size:13px; color:var(--muted); line-height:1.45}
.banner{border-radius:var(--r); padding:11px 13px; font-size:14px; display:flex; gap:10px; align-items:flex-start; border:1px solid}
.banner.info{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent); color:var(--accent-ink)}
.banner.warn{background:var(--signal-soft); border-color:color-mix(in srgb, var(--signal) 55%, transparent); color:var(--ink)}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:120;
  background:var(--ink); color:var(--ground); padding:11px 17px; border-radius:999px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow-2); max-width:88vw; text-align:center;
}
.ratetable{width:100%; border-collapse:collapse; font-size:14px}
.ratetable th{text-align:left; font-family:"Barlow Condensed",sans-serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line-strong)}
.ratetable td{padding:4px 8px; border-bottom:1px solid var(--line)}
.ratetable td:last-child{width:104px}
.ratetable input{min-height:38px; padding:4px 8px; text-align:right}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.disclose{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; cursor:pointer}
.disclose .caret{transition:transform .18s ease}
details[open] > .disclose .caret{transform:rotate(180deg)}
.more{margin-top:7px}
.more > summary{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; min-height:34px}
.more > summary .caret{width:14px; height:14px; stroke:currentColor}
details.more[open] > summary .caret{transform:rotate(180deg)}
#updateBar{
  position:fixed; left:0; right:0; bottom:0; z-index:110;
  background:var(--accent); color:#fff;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:12px;
  box-shadow:0 -6px 20px -10px rgba(0,0,0,.5);
}
#updateBar.on{display:flex}
#updateBar .msg{flex:1; font-size:14px; font-weight:600; line-height:1.25}
#updateBar button{
  flex:none; background:#fff; color:var(--accent-ink); border-radius:999px;
  padding:0 15px; min-height:38px; font-weight:700; font-size:14px;
}
:root[data-theme="dark"] #updateBar{color:#08201F}
:root[data-theme="dark"] #updateBar button{background:#08201F; color:var(--accent)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #updateBar{color:#08201F}
  :root:not([data-theme="light"]) #updateBar button{background:#08201F; color:var(--accent)}
}
.kindtag{
  flex:none; align-self:flex-start; font-family:"Barlow Condensed",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:2px 8px;
  border-radius:999px; border:1px solid var(--line-strong); color:var(--muted); background:var(--surface-2);
}
.kindtag.k-window{color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 45%, transparent); background:var(--accent-soft)}
.kindtag.k-floor{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent); background:color-mix(in srgb, var(--warn) 12%, transparent)}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<div class="topbar"><div class="wrap topbar-in" id="topbar"></div></div>

<main>
  <section id="s-home" class="screen"></section>
  <section id="s-wt" class="screen"></section>
  <section id="s-set" class="screen"></section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add a room">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <div class="wrap">
        <div class="topbar-in">
          <h1 style="font-size:20px">Add a room</h1>
          <button class="iconbtn" data-close aria-label="Close">Cancel</button>
        </div>
        <div style="padding-bottom:10px">
          <input id="typeSearch" type="search" placeholder="Search room types…" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="sheet-body"><div class="wrap" id="typeResults"></div></div>
  </div>

<script>
"use strict";

/* ============================ storage ============================ */

const LS_KEY = "mod_bid_walkthroughs_v1";
const LS_RATES = "mod_bid_rates_v1";
const LS_RECENT = "mod_bid_recent_types_v1";
const LS_PREFS  = "mod_bid_prefs_v1";
const LS_THEME  = "mod_bid_theme_v1";

function safeGet(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast("Couldn't save to this device — storage may be full."); return false; }
}

let DB = safeGet(LS_KEY, { walkthroughs: [] });
if (!DB || !Array.isArray(DB.walkthroughs)) DB = { walkthroughs: [] };
let RATES = Object.assign({}, DEFAULT_RATES, safeGet(LS_RATES, {}).rates || {});
let FIXMIN = Object.assign({}, DEFAULT_FIXTURE_MIN, safeGet(LS_RATES, {}).fixmin || {});
let GLASSMIN = Object.assign({}, DEFAULT_GLASS_MIN, safeGet(LS_RATES, {}).glassmin || {});
let FLOORRATE = Object.assign({}, DEFAULT_FLOOR_RATES, safeGet(LS_RATES, {}).floorrate || {});
let RECENT = safeGet(LS_RECENT, {});
if (Array.isArray(RECENT)) RECENT = { janitorial: RECENT };
KIND_ORDER.forEach(k => { if (!Array.isArray(RECENT[k])) RECENT[k] = []; });
let PREFS = Object.assign({ sendTo: "" }, safeGet(LS_PREFS, {}));

/* auto = follow the device. The other two override it, which is what you want
   walking a dim mechanical room at 6am with the phone set to daylight. */
const THEMES = ["auto", "light", "dark"];
const THEME_WORD = { auto: "Follows your device", light: "Light", dark: "Night" };
let THEME = "auto";
try { const t = localStorage.getItem(LS_THEME); if (THEMES.indexOf(t) >= 0) THEME = t; } catch(e){}

function applyTheme(){
  const root = document.documentElement;
  if (THEME === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", THEME);
}
function cycleTheme(){
  THEME = THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length];
  try { localStorage.setItem(LS_THEME, THEME); } catch(e){}
  applyTheme();
  renderTopbar();
  toast(THEME === "auto" ? "Follows your device" : THEME === "dark" ? "Night mode on" : "Light mode on");
}
applyTheme();

function save(){ DB.walkthroughs.forEach(w => { if (w._dirty) w.dirty = true; }); safeSet(LS_KEY, DB); }
function saveRates(){ safeSet(LS_RATES, { rates: RATES, fixmin: FIXMIN, glassmin: GLASSMIN, floorrate: FLOORRATE }); }
function saveRecent(){ KIND_ORDER.forEach(k => { RECENT[k] = (RECENT[k]||[]).slice(0,8); }); safeSet(LS_RECENT, RECENT); }
function savePrefs(){ safeSet(LS_PREFS, PREFS); }

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }

/* ---- photos live in IndexedDB so they never crowd out the walkthrough data ---- */
let idb = null;
function openPhotoStore(){
  if (idb) return Promise.resolve(idb);
  return new Promise(res => {
    try {
      const req = indexedDB.open("mod_bid_photos", 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("photos"); };
      req.onsuccess = () => { idb = req.result; res(idb); };
      req.onerror = () => res(null);
    } catch(e){ res(null); }
  });
}
async function putPhoto(id, rec){
  const db = await openPhotoStore(); if (!db) return false;
  return new Promise(res => {
    const tx = db.transaction("photos","readwrite");
    tx.objectStore("photos").put(rec, id);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
  });
}
async function getPhoto(id){
  const db = await openPhotoStore(); if (!db) return null;
  return new Promise(res => {
    const tx = db.transaction("photos","readonly");
    const r = tx.objectStore("photos").get(id);
    r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
  });
}
async function delPhoto(id){
  const db = await openPhotoStore(); if (!db) return;
  const tx = db.transaction("photos","readwrite");
  tx.objectStore("photos").delete(id);
}

/* ============================ model ============================ */

function newWalkthrough(kind){
  kind = KINDS[kind] ? kind : "janitorial";
  return {
    id: uid(), kind: kind, name: "", createdAt: nowISO(), updatedAt: nowISO(),
    contactName:"", contactPhone:"", contactEmail:"", address:"",
    buildingSqft:"", floors:"", occupants:"", incumbent:"", bidDue:"", siteNotes:"",
    defaultFreq: DEFAULT_FREQ[kind], rooms: [], sentAt: null
  };
}
function newRoom(typeId, freq){
  const hint = FIXTURE_HINT[typeId] || [];
  return {
    id: uid(), type: typeId, label: "",
    len:"", wid:"", sqft:"", floor:"", freq: freq || "5",
    service:"", coats:1, fixtures:{}, notes:"", photos:[], _hint:hint
  };
}
function newGlass(typeId){
  return {
    id: uid(), type: typeId, label: "",
    len:"", wid:"", count:1, sides:"both", access:"ground",
    notes:"", photos:[]
  };
}
function itemName(w, item){
  return kindOf(w) === "window" ? (GLASS_NAME[item.type] || "Glass") : (TYPE_NAME[item.type] || "Room");
}
function roomLabel(w, room){
  if (room.label) return room.label;
  const base = itemName(w, room);
  const same = w.rooms.filter(r => r.type === room.type);
  if (same.length < 2) return base;
  return base + " " + (same.indexOf(room) + 1);
}
function wtName(w){ return w.name && w.name.trim() ? w.name.trim() : "Untitled account"; }

/* ============================ estimate ============================ */

function roomSqft(r){
  const explicit = parseFloat(r.sqft);
  if (!isNaN(explicit) && explicit > 0) return explicit;
  const l = parseFloat(r.len), wd = parseFloat(r.wid);
  if (!isNaN(l) && !isNaN(wd)) return l * wd;
  return 0;
}
function paneCount(g){
  const n = parseInt(g.count, 10);
  return isNaN(n) || n < 0 ? 0 : n;
}
function glassSqft(g){
  const l = parseFloat(g.len), wd = parseFloat(g.wid);
  if (isNaN(l) || isNaN(wd)) return 0;
  return l * wd * paneCount(g);
}
function glassHours(g){
  const per = GLASSMIN[g.type] != null ? GLASSMIN[g.type] : (DEFAULT_GLASS_MIN.other_glass || 3);
  const sides = SIDES_FACTOR[g.sides] != null ? SIDES_FACTOR[g.sides] : 1;
  const access = ACCESS_FACTOR[g.access] != null ? ACCESS_FACTOR[g.access] : 1;
  return paneCount(g) * per * sides * access / 60;
}
function floorHours(r){
  const rate = FLOORRATE[r.service];
  if (!rate || rate <= 0) return 0;
  const coats = Math.max(1, parseInt(r.coats, 10) || 1);
  return roomSqft(r) / rate * coats;
}
function roomHoursPerVisit(r){
  const sq = roomSqft(r);
  const rate = RATES[r.type] || DEFAULT_RATES.other;
  let h = rate > 0 ? sq / rate : 0;
  let mins = 0;
  for (const k in r.fixtures){
    const n = r.fixtures[k] || 0;
    if (n > 0) mins += n * (FIXMIN[k] != null ? FIXMIN[k] : 0);
  }
  return h + mins / 60;
}
/* One entry point so every screen asks the same question of any item. */
function itemHours(w, item){
  const k = kindOf(w);
  return k === "window" ? glassHours(item) : k === "floor" ? floorHours(item) : roomHoursPerVisit(item);
}
function itemSqft(w, item){
  return kindOf(w) === "window" ? glassSqft(item) : roomSqft(item);
}
function totals(w){
  const kind = kindOf(w);
  const acct = w.defaultFreq || DEFAULT_FREQ[kind];
  let sqft = 0, visit = 0, year = 0, panes = 0;

  w.rooms.forEach(item => {
    const hrs = itemHours(w, item);
    sqft += itemSqft(w, item);
    visit += hrs;
    if (kind === "window"){
      panes += paneCount(item);
      year += hrs * (FREQ_PER_YEAR[acct] || 0);
    } else {
      const f = kind === "floor" ? (item.freq || acct) : item.freq;
      year += hrs * (FREQ_PER_YEAR[f] != null ? FREQ_PER_YEAR[f] : 0);
    }
  });

  const week = year / 52;
  return {
    kind, sqft, panes, week, month: week * WEEKS_PER_MONTH, year,
    visit, fullVisit: visit, rooms: w.rooms.length,
    once: (kind !== "janitorial") && (acct === "once")
  };
}
function fmtNum(n, dp){
  if (!isFinite(n)) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: dp||0, maximumFractionDigits: dp||0 });
}
function fmtHrs(h){ return h >= 100 ? fmtNum(h,0) : fmtNum(h,1); }
</script>

  moon:'<path d="M20.5 14.6A8.6 8.6 0 019.4 3.5a8.6 8.6 0 1011.1 11.1z"/>',

};
const svg = (n, cls) => '<svg class="'+(cls||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';

let view = { screen:"home", wtId:null, openRoom:null };
let toastTimer = null;
function toast(msg){
  let el = $("#toast");
  if (!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg; el.style.display="block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display="none"; }, 2600);
}
function currentWT(){ return DB.walkthroughs.find(w => w.id === view.wtId) || null; }
function repress(key, ownerId, current){
  document.querySelectorAll('[data-chipgroup="'+key+'"][data-rid="'+ownerId+'"] .chip')
    .forEach(c => c.setAttribute("aria-pressed", String(c.dataset.val === current)));
}
function touch(w){ w.updatedAt = nowISO(); w.dirty = true; save(); }

/* ============================ topbar ============================ */

function renderTopbar(){
  const t = $("#topbar");
  if (view.screen === "home"){
    t.innerHTML =
      '<div class="grow"><div class="brandmark"><span class="rule"></span>Myles O\'Donnell &amp; Co.</div>'+
      '<h1 style="font-size:24px">Busy Bidder</h1></div>'+
      '<button class="iconbtn" data-act="theme" aria-label="Screen brightness: '+esc(THEME_WORD[THEME])+'">'+
        svg(THEME === "dark" ? "moon" : THEME === "light" ? "sun" : "auto")+'</button>'+
      '<button class="iconbtn" data-go="set" aria-label="Rates and settings">'+svg("gear")+'</button>';
  } else if (view.screen === "wt"){
    const w = currentWT();
    t.innerHTML =
      '<button class="iconbtn" data-act="nav-back" aria-label="All walkthroughs">'+svg("back")+'</button>'+
      '<h1>'+esc(w ? wtName(w) : "Walkthrough")+'</h1>'+
      (w ? '<button class="iconbtn" data-act="email" data-wtid="'+w.id+'" aria-label="Send this walkthrough">'+svg("mail")+'</button>' : "");
  } else {
    t.innerHTML =
      '<button class="iconbtn" data-act="nav-back" aria-label="Back">'+svg("back")+'</button>'+
      '<h1>Rates &amp; settings</h1>';
  }
}

/* ============================ home ============================ */

function renderHome(){
  const list = DB.walkthroughs.slice().sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||""));
  const unsent = list.filter(w => !w.sentAt || w.dirty).length;
  let h = '<div class="wrap">';

  h += '<div class="section"><div class="stack-sm">'+
       '<button class="btn btn-primary btn-block" data-act="new" data-kind="janitorial">'+svg("plus")+'Start a new walkthrough</button>'+
       '<button class="btn btn-ghost btn-block" data-act="new" data-kind="window">'+svg("glass")+'Start a new window quote</button>'+
       '<button class="btn btn-ghost btn-block" data-act="new" data-kind="floor">'+svg("floor")+'Start a new floor quote</button>'+
       '</div></div>';

  if (!list.length){
    h += '<div class="empty"><h3>Nothing quoted yet</h3><p class="note">Start one when you pull up to the building. '+
         'Add the account name, then tap it in as you walk. Everything saves on this phone — no signal needed.</p></div>';
  } else {
    h += '<div class="section"><div class="section-head"><span class="eyebrow">Quotes</span>'+
         (unsent ? '<span class="pill warn"><span class="dot"></span>'+unsent+' not sent</span>' : '<span class="pill ok"><span class="dot"></span>All sent</span>')+
         '</div><div class="stack">';
    list.forEach(w => {
      const t = totals(w);
      const kind = kindOf(w);
      const sent = (w.sentAt && !w.dirty) ? "yes" : "no";
      let meta;
      if (kind === "window"){
        meta = '<span><b>'+fmtNum(t.panes)+'</b> panes</span>'+
               '<span><b>'+fmtNum(t.sqft)+'</b> sq ft glass</span>'+
               '<span><b>'+fmtHrs(t.visit)+'</b> hrs/visit</span>';
      } else if (kind === "floor"){
        meta = '<span><b>'+t.rooms+'</b> areas</span>'+
               '<span><b>'+fmtNum(t.sqft)+'</b> sq ft</span>'+
               '<span><b>'+fmtHrs(t.visit)+'</b> hrs/job</span>';
      } else {
        meta = '<span><b>'+t.rooms+'</b> rooms</span>'+
               '<span><b>'+fmtNum(t.sqft)+'</b> sq ft</span>'+
               '<span><b>'+fmtHrs(t.month)+'</b> hrs/mo</span>';
      }
      h += '<button class="wt-item" data-open="'+w.id+'" data-synced="'+sent+'" data-kind="'+kind+'">'+
           '<span class="wt-rail"></span><span class="wt-body">'+
           '<span class="row" style="gap:8px">'+
             '<span class="wt-name grow">'+esc(wtName(w))+'</span>'+
             '<span class="kindtag k-'+kind+'">'+esc(KINDS[kind].badge)+'</span>'+
           '</span>'+
           '<span class="wt-meta">'+ meta +
             '<span>'+esc(shortDate(w.updatedAt))+'</span>'+
           '</span></span></button>';
    });
    h += '</div></div>';
  }

  if (list.length){
    h += '<div class="section">'+
         '<button class="btn btn-ghost btn-block" data-act="export-all">'+svg("down")+'Save everything as one spreadsheet</button>'+
         '</div>';
  }

  h += '<p class="note" style="margin:26px 0 34px">Works with no signal once the page is open. '+
       'Everything you type is saved on this phone the moment you type it. Open a quote and tap the envelope to send it out.</p>';
  h += '</div>';
  $("#s-home").innerHTML = h;
}
function shortDate(iso){
  if (!iso) return "";
  const d = new Date(iso), n = new Date();
  const same = d.toDateString() === n.toDateString();
  if (same) return "Today " + d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

</script>

<script>
"use strict";

/* ============================ walkthrough screen ============================ */

function renderWT(){
  const w = currentWT();
  if (!w){ goHomeReplacing(); return; }
  const kind = kindOf(w);
  const K = KINDS[kind];
  const t = totals(w);
  let h = '<div class="wrap">';

  h += '<div class="section" style="margin-top:14px">'+
       '<label class="field"><span>Account name</span>'+
       '<input id="f-name" data-wt="name" value="'+esc(w.name)+'" placeholder="Who are you bidding?" autocomplete="off"></label>'+
       '<span class="kindtag k-'+kind+'" style="margin-top:2px">'+esc(K.badge)+'</span>'+
       '</div>';

  h += '<div class="card" style="padding:13px 14px; margin-bottom:12px">'+
       chipBlock(kind === "janitorial" ? "Service frequency" : "How often", "wtfreq", "wt",
         freqChips(kind, "common"), freqChips(kind, "more"),
         w.defaultFreq || DEFAULT_FREQ[kind], "Other schedules")+
       '<p class="note" style="margin-top:7px">New rooms start here — override any room on its own.</p>'+
       '<div id="freqApply">'+freqApplyHTML(w)+'</div>'+
       '</div>';

  h += '<div class="totals" id="totals">'+totalsInner(t)+'</div>';

  h += '<details class="card" style="margin-top:12px" '+(w.name?"":"open")+'>'+
       '<summary class="disclose"><span class="eyebrow">Site details</span>'+
       '<svg class="caret" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">'+ICON.chev+'</svg></summary>'+
       '<div style="padding:0 14px 14px" class="stack">'+
       '<div class="grid-2">'+
         field("contactName","Contact","Name at the site")+
         field("contactPhone","Phone","","tel")+
       '</div>'+
       field("contactEmail","Email","","email")+
       field("address","Address","Street, city")+
       '<div class="grid-3">'+
         field("buildingSqft","Bldg sq ft","","number")+
         field("floors","Floors","","number")+
         field("occupants","Occupants","","number")+
       '</div>'+
       '<div class="grid-2">'+
         field("incumbent","Current cleaner","Who has it now")+
         field("bidDue","Bid due","","date")+
       '</div>'+
       '<label class="field"><span>Site notes</span><textarea data-wt="siteNotes" placeholder="Access, alarm code, dock hours, anything the crew needs to know">'+esc(w.siteNotes)+'</textarea></label>'+
       '</div></details>';

  h += '<div class="section"><div class="section-head"><span class="eyebrow">'+esc(K.itemWord)+'</span>'+
       '<span class="note num">'+t.rooms+' added</span></div>';
  if (!w.rooms.length){
    h += '<div class="empty"><h3>Nothing added yet</h3><p class="note">Tap <b>'+esc(K.addLabel)+'</b> and pick what you\'re looking at.</p></div>';
  } else {
    h += '<div class="stack" id="roomlist">'+ w.rooms.map((r,i) => roomHTML(w,r,i)).join("") +'</div>';
  }
  h += '</div>';

  h += '<div class="section"><div class="stack-sm">'+
       '<button class="btn btn-solid btn-block" data-act="email" data-wtid="'+w.id+'">'+svg("mail")+'Send this '+esc(K.noun)+'</button>'+
       '<button class="btn btn-ghost btn-block" data-act="nav-back">Done for now — back to the list</button>'+
       '</div>'+
       '<p class="note" style="margin-top:8px">Nothing to save. Every word is written to this phone as you type it.</p>'+
       (w.sentAt ? '<p class="note" style="margin-top:6px">Last sent '+esc(shortDate(w.sentAt))+(w.dirty?' — edited since':'')+'.</p>' : '')+
       '</div>';

  h += '<div class="section" style="align-items:center"><button class="btn btn-sm" style="color:var(--crit);font-weight:600" data-act="del-wt">Delete this '+esc(K.noun)+'</button></div>';
  h += '</div>';

  h += '<div class="bottombar"><div class="wrap"><button class="btn btn-primary btn-block" data-act="add-room">'+svg("plus")+esc(K.addLabel)+'</button></div></div>';

  $("#s-wt").innerHTML = h;
  if (view.openRoom){
    const open = w.rooms.find(r => r.id === view.openRoom);
    if (open) fillDetailValues(open);
  }

  function field(key,label,ph,type){
    return '<label class="field"><span>'+esc(label)+'</span><input data-wt="'+key+'" type="'+(type||"text")+'" value="'+esc(w[key])+'" placeholder="'+esc(ph||"")+'" autocomplete="off"></label>';
  }
}

function freqApplyHTML(w){
  if (kindOf(w) === "window") return "";
  const off = w.rooms.filter(r => r.freq !== (w.defaultFreq || DEFAULT_FREQ[kindOf(w)])).length;
  if (!off) return "";
  return '<button class="btn btn-ghost btn-sm" style="margin-top:9px" data-act="apply-freq">'+
    'Put '+off+' '+(off>1?"more on ":"on ")+esc(FREQ_LABEL[w.defaultFreq || DEFAULT_FREQ[kindOf(w)]])+' too</button>';
}
function patchFreqApply(){
  const w = currentWT(); if (!w) return;
  const el = $("#freqApply"); if (el) el.innerHTML = freqApplyHTML(w);
}
function totalsInner(t){
  if (t.kind === "window"){
    return '<div class="tot"><span class="k">Panes</span><span class="v">'+fmtNum(t.panes)+'</span></div>'+
           '<div class="tot"><span class="k">Sq ft glass</span><span class="v">'+fmtNum(t.sqft)+'</span></div>'+
           '<div class="tot hl"><span class="k">Hrs / visit</span><span class="v">'+fmtHrs(t.visit)+'</span></div>';
  }
  if (t.kind === "floor"){
    return '<div class="tot"><span class="k">Sq ft</span><span class="v">'+fmtNum(t.sqft)+'</span></div>'+
           '<div class="tot hl"><span class="k">Hrs / job</span><span class="v">'+fmtHrs(t.visit)+'</span></div>'+
           '<div class="tot"><span class="k">'+(t.once ? "One time" : "Hrs / year")+'</span>'+
             '<span class="v">'+(t.once ? "—" : fmtHrs(t.year))+'</span></div>';
  }
  return '<div class="tot"><span class="k">Sq ft</span><span class="v">'+fmtNum(t.sqft)+'</span></div>'+
         '<div class="tot"><span class="k">Hrs / week</span><span class="v">'+fmtHrs(t.week)+'</span></div>'+
         '<div class="tot hl"><span class="k">Hrs / month</span><span class="v">'+fmtHrs(t.month)+'</span></div>';
}
function patchTotals(){
  const w = currentWT(); if (!w) return;
  const el = $("#totals"); if (el) el.innerHTML = totalsInner(totals(w));
}

/* ---------- one room ---------- */

function hoursLabel(kind){ return kind === "floor" ? "min / job" : "min / visit"; }

function roomHTML(w, r, i){
  const open = view.openRoom === r.id;
  const kind = kindOf(w);
  return '<div class="room'+(open?" open":"")+'" data-room="'+r.id+'">'+
    '<button class="room-head" data-toggle="'+r.id+'" aria-expanded="'+open+'">'+
      '<span class="room-idx num">'+(i+1)+'</span>'+
      '<span class="grow">'+
        '<span class="room-title" style="display:block">'+esc(roomLabel(w,r))+'</span>'+
        '<span class="room-sub" data-sub="'+r.id+'">'+roomSubHTML(r,w)+'</span>'+
      '</span>'+
      '<span class="room-hrs"><span class="n" data-hrs="'+r.id+'">'+fmtNum(itemHours(w,r)*60,0)+'</span><br><span class="l">'+hoursLabel(kind)+'</span></span>'+
      '<svg class="caret" viewBox="0 0 24 24" aria-hidden="true">'+ICON.chev+'</svg>'+
    '</button>'+
    (open ? roomDetailHTML(r, w) : "") +
  '</div>';
}
function roomSubHTML(r, w){
  w = w || currentWT();
  const kind = kindOf(w);
  const parts = [];

  if (kind === "window"){
    parts.push(paneCount(r) + (paneCount(r) === 1 ? " pane" : " panes"));
    const gs = glassSqft(r);
    if (gs) parts.push(fmtNum(gs) + " sq ft glass");
    parts.push(SIDES_LABEL[r.sides] || "");
    if (r.access && r.access !== "ground") parts.push(ACCESS_LABEL[r.access] || "");
    if (r.photos && r.photos.length) parts.push(r.photos.length + (r.photos.length===1?" photo":" photos"));
    return parts.filter(Boolean).map(x => "<span>"+esc(x)+"</span>").join("");
  }

  const sq = roomSqft(r);
  parts.push(sq ? fmtNum(sq)+" sq ft" : "no sq ft yet");
  if (kind === "floor"){
    parts.push(r.service ? FLOOR_SERVICE_NAME[r.service] : "pick a service");
    if (r.floor) parts.push(r.floor);
    if ((parseInt(r.coats,10) || 1) > 1) parts.push((parseInt(r.coats,10)) + " passes");
  } else {
    if (r.floor) parts.push(r.floor);
  }
  parts.push(FREQ_LABEL[r.freq] || "");
  if (r.photos && r.photos.length) parts.push(r.photos.length + (r.photos.length===1?" photo":" photos"));
  return parts.filter(Boolean).map(p => "<span>"+p+"</span>").join("");
}
function patchRoom(rid){
  const w = currentWT(); if (!w) return;
  const r = w.rooms.find(x => x.id === rid); if (!r) return;
  const sub = document.querySelector('[data-sub="'+rid+'"]');
  if (sub) sub.innerHTML = roomSubHTML(r, w);
  const hrs = document.querySelector('[data-hrs="'+rid+'"]');
  if (hrs) hrs.textContent = fmtNum(itemHours(w,r)*60,0);
  patchTotals();
}

function roomDetailHTML(r, w){
  w = w || currentWT();
  const kind = kindOf(w);
  return kind === "window" ? glassDetailHTML(r, w)
       : kind === "floor"   ? floorDetailHTML(r, w)
       : janitorialDetailHTML(r, w);
}

/* the notes textarea is filled in after render so quotes in the text can't break the markup */
function fillDetailValues(r){
  const ta = document.querySelector('textarea[data-r="notes"][data-rid="'+r.id+'"]');
  if (ta) ta.value = r.notes || "";
}

function nameField(r, placeholder){
  return '<label class="field"><span>Name this one (optional)</span>'+
    '<input data-r="label" data-rid="'+r.id+'" value="'+esc(r.label)+'" placeholder="'+esc(placeholder)+'" autocomplete="off"></label>';
}
function measureRow(r, hint){
  return '<div><div class="eyebrow" style="margin-bottom:6px">Measure</div>'+
    '<div class="sqft-row">'+
      '<label class="field"><span>Length</span><input data-r="len" data-rid="'+r.id+'" type="number" inputmode="decimal" value="'+esc(r.len)+'" placeholder="ft"></label>'+
      '<span class="x">×</span>'+
      '<label class="field"><span>Width</span><input data-r="wid" data-rid="'+r.id+'" type="number" inputmode="decimal" value="'+esc(r.wid)+'" placeholder="ft"></label>'+
      '<span class="x">=</span>'+
      '<label class="field"><span>Sq ft</span><input data-r="sqft" data-rid="'+r.id+'" type="number" inputmode="numeric" class="num" style="text-align:right;font-weight:700" value="'+esc(r.sqft)+'" placeholder="0"></label>'+
    '</div>'+
    '<p class="note" style="margin-top:5px">'+esc(hint)+'</p>'+
  '</div>';
}
function counterRow(r, key, label, min){
  const val = (r[key] == null || r[key] === "") ? (min || 0) : r[key];
  return '<div class="fix" data-cnt="'+key+'" data-rid="'+r.id+'" data-min="'+(min||0)+'">'+
    '<span class="fl">'+esc(label)+'</span>'+
    '<span class="stepper">'+
      '<button class="stp" data-step="-1" aria-label="Fewer '+esc(label)+'">−</button>'+
      '<input class="fv num" type="number" inputmode="numeric" data-r="'+key+'" data-rid="'+r.id+'" '+
        'value="'+esc(val)+'" aria-label="'+esc(label)+'">'+
      '<button class="stp" data-step="1" aria-label="More '+esc(label)+'">+</button>'+
    '</span>'+
  '</div>';
}

/* ---------------- janitorial ---------------- */

function janitorialDetailHTML(r, w){
  const notePlaceholder = "Condition, problem spots, what the customer complained about";
  const hint = (FIXTURE_HINT[r.type] || ["trash"]).slice();
  Object.keys(r.fixtures||{}).forEach(k => { if (r.fixtures[k] > 0 && hint.indexOf(k) < 0) hint.push(k); });
  const rest = FIXTURES.filter(([id]) => hint.indexOf(id) < 0);

  return '<div class="room-detail">'+
    nameField(r, TYPE_NAME[r.type] || "Room")+
    measureRow(r, "Type length and width to fill sq ft in, or just put the sq ft straight in.")+

    chipBlock("Floor","floor",r.id,
      FLOORS_COMMON.map(f => [f,f]), FLOORS_MORE.map(f => [f,f]), r.floor, "More floor types")+

    chipBlock("How often it gets cleaned","freq",r.id,
      freqChips("janitorial","common"), freqChips("janitorial","more"), r.freq, "Other schedules")+

    '<div><div class="eyebrow" style="margin-bottom:6px">What\'s in it</div>'+
      '<div class="fixgrid">'+ hint.map(id => fixHTML(r,id)).join("") +'</div>'+
      (rest.length ? '<details class="more"><summary>More fixtures'+
        '<svg class="caret" viewBox="0 0 24 24" aria-hidden="true">'+ICON.chev+'</svg></summary>'+
        '<div class="fixgrid" style="margin-top:8px">'+ rest.map(([id]) => fixHTML(r,id)).join("") +'</div></details>' : "")+
    '</div>'+

    '<label class="field"><span>Notes</span><textarea data-r="notes" data-rid="'+r.id+'" placeholder="'+esc(notePlaceholder)+'"></textarea></label>'+

    '<div><div class="eyebrow" style="margin-bottom:6px">Photos</div>'+
      '<div class="photos" data-photos="'+r.id+'">'+
        (r.photos||[]).map(x => '<span class="photo" data-pid="'+x+'"><img alt="Photo" data-src="'+x+'"><button data-delphoto="'+x+'" data-rid="'+r.id+'" aria-label="Remove photo">×</button></span>').join("")+
        (CAM_OK ? '<button class="addphoto" data-act="add-photo" data-rid="'+r.id+'">'+svg("cam")+'Camera</button>' : '')+
        '<button class="addphoto" data-act="pick-photo" data-rid="'+r.id+'">'+svg("pic")+(CAM_OK ? 'Files' : 'Add')+'</button>'+

/* ============================ room type picker ============================ */

function pickerFor(kind){
  return kind === "window" ? { cats: WINDOW_CATEGORIES, names: GLASS_NAME }
                           : { cats: CATEGORIES,        names: TYPE_NAME };
}
function openTypeSheet(){

  if (head) head.textContent = K.pickTitle;
  $("#typeSearch").placeholder = K.searchPlaceholder;

  $("#sheet").classList.add("on");

  pushNav({ sheet: "type", screen: view.screen, wtId: view.wtId });
  setTimeout(() => { $("#typeSearch").focus({ preventScroll:true }); }, 60);
}
function hideTypeSheet(){
  $("#sheet").classList.remove("on");
  document.body.style.overflow = "";
}
function closeTypeSheet(){
  if ($("#sheet").classList.contains("on")) navBack(); else hideTypeSheet();
}
function renderTypes(q){
  q = (q||"").trim().toLowerCase();
  const kind = kindOf(currentWT());
  const { cats, names } = pickerFor(kind);
  const recents = RECENT[kind] || [];
  let h = "";
  if (!q && recents.length){
    h += '<div class="cat"><span class="eyebrow">Used recently</span></div><div class="typelist">'+
      recents.filter(id => names[id]).map(id => '<button class="type" data-type="'+id+'">'+esc(names[id])+'</button>').join("")+
      '</div>';
  }
  let hits = 0;
  cats.forEach(([cat,list]) => {
    const match = list.filter(([id,name]) => !q || name.toLowerCase().includes(q) || cat.toLowerCase().includes(q));
    if (!match.length) return;
    hits += match.length;
    h += '<div class="cat"><span class="eyebrow">'+esc(cat)+'</span></div><div class="typelist">'+
      match.map(([id,name]) => '<button class="type" data-type="'+id+'">'+esc(name)+'</button>').join("")+
      '</div>';
  });
  if (!hits){
    const fallback = kind === "window" ? "other_glass" : "other";
    h += '<div class="empty" style="margin-top:22px"><h3>No match</h3><p class="note">Pick <b>Other</b> and type the name yourself.</p>'+
      '<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-type="'+fallback+'">Use “Other”</button></div></div>';
  }
