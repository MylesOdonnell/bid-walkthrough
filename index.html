/* ============================ photos ============================ */

let photoTargetRoom = null;

/* Some tablets have no camera the browser will hand over. Asking one for a rear
   camera there does nothing at all — no picker, no error — so don't offer the
   button. Only hide it on a clear "zero cameras" answer; anything ambiguous
   keeps it, since a missing button is worse than a redundant one. */
let CAM_OK = true;
let camWatch = null;

/* Tapping Camera hands off to the phone's camera app, which backgrounds this page.
   If the page never goes hidden, nothing answered — usually Chrome is denied camera
   permission in Android settings. Say so instead of leaving a dead button. */
function watchCameraLaunch(){
  if (camWatch){ clearTimeout(camWatch.timer); document.removeEventListener("visibilitychange", camWatch.onHide); }
  const w = { launched: false };
  w.onHide = () => { if (document.hidden) w.launched = true; };
  document.addEventListener("visibilitychange", w.onHide);
  w.timer = setTimeout(() => {
    document.removeEventListener("visibilitychange", w.onHide);
    camWatch = null;
    if (!w.launched) toast("No camera app opened. Let Chrome use the camera in your device settings, or tap Files.");
  }, 2500);
  camWatch = w;
}
function cameraDidOpen(){
  if (!camWatch) return;
  clearTimeout(camWatch.timer);
  document.removeEventListener("visibilitychange", camWatch.onHide);
  camWatch = null;
}
(async function detectCamera(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    const devices = await navigator.mediaDevices.enumerateDevices();
    if (!Array.isArray(devices) || !devices.length) return;
    if (!devices.some(d => d.kind === "videoinput")) {
      CAM_OK = false;
      if (view.screen === "wt" && view.openRoom){ renderWT(); hydratePhotos(); }
    }
  } catch(e){}
})();

function downscale(file, maxDim, quality){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => res(null);
      img.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(file);
  });
}
async function handlePhotoFile(file){
  const w = currentWT(); if (!w || !photoTargetRoom) return;
  const r = w.rooms.find(x => x.id === photoTargetRoom); if (!r) return;
  toast("Saving photo…");
  const full = await downscale(file, 1280, 0.62);
  const thumb = await downscale(file, 520, 0.55);
  if (!full){ toast("Couldn't read that photo."); return; }
  const pid = uid();
  const ok = await putPhoto(pid, { full, thumb: thumb || full });
  if (!ok){ toast("This device wouldn't store the photo."); return; }
  r.photos = r.photos || []; r.photos.push(pid);
  touch(w); patchRoom(r.id);
  const holder = document.querySelector('[data-photos="'+r.id+'"]');
  if (holder){
    const span = document.createElement("span");
    span.className = "photo"; span.dataset.pid = pid;
    span.innerHTML = '<img alt="Room photo"><button data-delphoto="'+pid+'" data-rid="'+r.id+'" aria-label="Remove photo">×</button>';
    span.querySelector("img").src = full;
    holder.insertBefore(span, holder.querySelector(".addphoto"));
  }
  toast("Photo added");
}
async function hydratePhotos(){
  const imgs = document.querySelectorAll("img[data-src]");
  for (const img of imgs){
    const rec = await getPhoto(img.dataset.src);
    if (rec) img.src = rec.thumb || rec.full;
    img.removeAttribute("data-src");
  }
}

/* ============================ router ============================ */

function go(screen, wtId, fromPop){
  view.screen = screen;
  if (wtId !== undefined) view.wtId = wtId;
  if (screen !== "wt") view.openRoom = null;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#s-" + (screen === "set" ? "set" : screen)).classList.add("on");
  renderTopbar();
  if (screen === "home") renderHome();
  else if (screen === "wt") { renderWT(); hydratePhotos(); }
  else { renderSettings(); paintOfflineState(); }
  window.scrollTo(0,0);
  if (!fromPop) pushNav({ screen: screen, wtId: view.wtId });
}
</script>

<script>
"use strict";

/* ============================ getting it off the phone ============================ */

/* Save a file the ordinary web way: the phone's share sheet where it exists,
   a plain download everywhere else. Must run inside the click, not after an await. */
function saveFile(filename, text, mime){
  const type = mime || "text/csv";
  let blob;
  try { blob = new Blob([text], { type: type }); } catch(e){ return false; }

  try {
    if (navigator.canShare && typeof File === "function"){
      const file = new File([blob], filename, { type: type });
      if (navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: filename }).catch(function(){});
        return true;
      }
    }
  } catch(e){}

  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 6000);
    return true;
  } catch(e){ return false; }
}

function exportRow(w, r){
  const kind = kindOf(w);
  const base = {
    quoteType: KINDS[kind].badge,
    account: wtName(w), address: w.address || "",
    contact: w.contactName || "", contactPhone: w.contactPhone || "", contactEmail: w.contactEmail || "",
    buildingSqft: w.buildingSqft || "", floors: w.floors || "", occupants: w.occupants || "",
    currentCleaner: w.incumbent || "", bidDue: w.bidDue || "",
    accountFrequency: FREQ_LABEL[w.defaultFreq || DEFAULT_FREQ[kind]] || "",
    siteNotes: (w.siteNotes || "").replace(/\s+/g," ").trim(),
    walkedOn: (w.createdAt || "").slice(0,10),
    item: roomLabel(w, r), type: itemName(w, r),
    length: r.len || "", width: r.wid || "",
    notes: (r.notes || "").replace(/\s+/g," ").trim(),
    photos: (r.photos || []).length
  };

  if (kind === "window"){
    return Object.assign(base, {
      panes: paneCount(r), sqftGlass: Math.round(glassSqft(r)),
      sides: SIDES_LABEL[r.sides] || "", access: ACCESS_LABEL[r.access] || "",
      service: "", floor: "", passes: "", fixtures: "",
      frequency: FREQ_LABEL[w.defaultFreq || DEFAULT_FREQ[kind]] || "",
      sqft: "", minutes: Math.round(glassHours(r) * 60)
    });
  }
  if (kind === "floor"){
    return Object.assign(base, {
      panes: "", sqftGlass: "", sides: "", access: "",
      service: r.service ? FLOOR_SERVICE_NAME[r.service] : "",
      floor: r.floor || "", passes: parseInt(r.coats,10) || 1, fixtures: "",
      frequency: FREQ_LABEL[r.freq] || "",
      sqft: Math.round(roomSqft(r)), minutes: Math.round(floorHours(r) * 60)
    });
  }
  return Object.assign(base, {
    panes: "", sqftGlass: "", sides: "", access: "", service: "", passes: "",
    floor: r.floor || "", fixtures: fixtureText(r),
    frequency: FREQ_LABEL[r.freq] || "",
    sqft: Math.round(roomSqft(r)), minutes: Math.round(roomHoursPerVisit(r) * 60)
  });
}
function fixtureText(r){
  return Object.keys(r.fixtures || {}).filter(k => r.fixtures[k] > 0)
    .map(k => ((FIXTURES.find(f => f[0] === k) || [k,k])[1]) + " " + r.fixtures[k]).join(", ");
}

/* ---------- the typed-out report ---------- */

function buildReport(w){
  const kind = kindOf(w);
  const K = KINDS[kind];
  const t = totals(w);
  const L = [];
  const walked = w.createdAt ? new Date(w.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
  L.push(K.reportTitle + " — " + wtName(w));
  L.push("Walked " + walked + " · Myles O'Donnell & Co.");
  L.push("");

  if (w.address) L.push("Address: " + w.address);
  const contact = [w.contactName, w.contactPhone, w.contactEmail].filter(Boolean).join(" · ");
  if (contact) L.push("Contact: " + contact);
  const bldg = [
    w.buildingSqft ? fmtNum(parseFloat(w.buildingSqft)) + " sq ft" : "",
    w.floors ? w.floors + (parseFloat(w.floors) === 1 ? " floor" : " floors") : "",
    w.occupants ? w.occupants + " occupants" : ""
  ].filter(Boolean).join(" · ");
  if (bldg) L.push("Building: " + bldg);
  if (w.incumbent) L.push("Current cleaner: " + w.incumbent);
  if (w.bidDue) L.push("Bid due: " + w.bidDue);
  L.push((kind === "janitorial" ? "Service frequency: " : "How often: ") +
         (FREQ_LABEL[w.defaultFreq || DEFAULT_FREQ[kind]] || ""));
  L.push("");

  L.push("TOTALS");
  if (kind === "window"){
    L.push("  Panes              " + fmtNum(t.panes));
    L.push("  Sq ft of glass     " + fmtNum(t.sqft));
    L.push("  Hours per visit    " + fmtHrs(t.visit));
    if (!t.once) L.push("  Hours per year     " + fmtHrs(t.year));
  } else if (kind === "floor"){
    L.push("  Sq ft              " + fmtNum(t.sqft));
    L.push("  Hours for the job  " + fmtHrs(t.visit));
    if (!t.once) L.push("  Hours per year     " + fmtHrs(t.year));
  } else {
    L.push("  Cleanable sq ft    " + fmtNum(t.sqft));
    L.push("  Hours per week     " + fmtHrs(t.week));
    L.push("  Hours per month    " + fmtHrs(t.month));
    L.push("  Full-service visit " + fmtHrs(t.fullVisit) + " hrs");
  }
  L.push("");

  L.push(K.itemWord.toUpperCase() + " (" + w.rooms.length + ")");
  L.push("");
  w.rooms.forEach((r, i) => {
    L.push((i+1) + ". " + roomLabel(w, r));
    if (kind === "window"){
      const each = (parseFloat(r.len) && parseFloat(r.wid)) ? " (" + r.len + " × " + r.wid + " ea.)" : "";
      L.push("   " + paneCount(r) + (paneCount(r) === 1 ? " pane" : " panes") + each +
             " · " + (SIDES_LABEL[r.sides] || "") +
             " · " + (ACCESS_LABEL[r.access] || "") +
             " · " + fmtNum(glassHours(r) * 60, 0) + " min");
      if (glassSqft(r)) L.push("   " + fmtNum(glassSqft(r)) + " sq ft of glass");
    } else if (kind === "floor"){
      const dims = (r.len && r.wid) ? "  (" + r.len + " × " + r.wid + ")" : "";
      const passes = (parseInt(r.coats,10) || 1) > 1 ? " · " + parseInt(r.coats,10) + " passes" : "";
      L.push("   " + fmtNum(roomSqft(r)) + " sq ft" + dims +
             (r.floor ? " · " + r.floor : "") +
             " · " + (r.service ? FLOOR_SERVICE_NAME[r.service] : "NO SERVICE PICKED") + passes +
             " · " + (FREQ_LABEL[r.freq] || "") +
             " · " + fmtNum(floorHours(r) * 60, 0) + " min");
    } else {
      const dims = (r.len && r.wid) ? "  (" + r.len + " × " + r.wid + ")" : "";
      L.push("   " + fmtNum(roomSqft(r)) + " sq ft" + dims +
             (r.floor ? " · " + r.floor : "") +
             " · " + (FREQ_LABEL[r.freq] || "") +
             " · " + fmtNum(roomHoursPerVisit(r) * 60, 0) + " min/visit");
      const fx = fixtureText(r);
      if (fx) L.push("   " + fx);
    }
    if (r.notes) L.push("   Notes: " + r.notes.replace(/\s+/g," ").trim());
    if ((r.photos || []).length) L.push("   " + r.photos.length + " photo" + (r.photos.length > 1 ? "s" : "") + " on the phone");
    L.push("");
  });

  if (w.siteNotes){ L.push("SITE NOTES"); L.push(w.siteNotes.replace(/\s+/g," ").trim()); L.push(""); }
  L.push("Hours are figured from the app's production rates, which are generic industry");
  L.push("ballparks until Myles O'Donnell & Co.'s real crew rates are loaded in.");
  return L.join("\n");
}

/* ---------- the send sheet ---------- */

let emailTarget = null;
let sharePayload = null;

function dataUrlToBlob(u){
  const comma = u.indexOf(",");
  const head = u.slice(0, comma);
  const bin = atob(u.slice(comma + 1));
  const mime = (head.match(/:(.*?);/) || [null, "image/jpeg"])[1];
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* Photos can't ride on a mailto link, but the phone's share sheet takes them as
   real attachments. Gather them up front — navigator.share has to be called
   straight off the tap, with no awaits in between. */
async function prepareShare(w){
  sharePayload = null;
  const btn = $("#shareBtn");
  if (btn) btn.style.display = "none";
  if (typeof File !== "function" || !navigator.canShare || !navigator.share) return;

  const files = [];
  let n = 0;
  for (const r of w.rooms){
    let k = 0;
    for (const pid of (r.photos || [])){
      if (n >= 20) break;
      const rec = await getPhoto(pid);
      if (!rec || !rec.full) continue;
      n++; k++;
      const name = String(n).padStart(2, "0") + "-" + slug(roomLabel(w, r)) + (k > 1 ? "-" + k : "") + ".jpg";
      try { files.push(new File([dataUrlToBlob(rec.full)], name, { type: "image/jpeg" })); } catch(e){}
    }
  }
  if (!files.length) return;
  try { if (!navigator.canShare({ files: files })) return; } catch(e){ return; }

  sharePayload = { files: files, title: "Bid walkthrough — " + wtName(w), text: buildReport(w) };
  if (emailTarget !== w.id) return;
  if (btn){
    btn.style.display = "";
    btn.querySelector(".lbl").textContent =
      "Send with " + files.length + " photo" + (files.length > 1 ? "s" : "");
  }
}

function doShare(){
  if (!sharePayload) return;
  const w = DB.walkthroughs.find(x => x.id === emailTarget);
  copyReport();
  if (w) markSent(w);
  try { navigator.share(sharePayload).catch(function(){}); }
  catch(e){ toast("This device can't share files. Use the email button instead."); }
}

function openEmailSheet(wtId){
  const w = DB.walkthroughs.find(x => x.id === wtId); if (!w) return;
  emailTarget = wtId;
  const report = buildReport(w);
  $("#emailBody").innerHTML =
    '<div class="section" style="margin-top:14px">'+
      '<label class="field"><span>Send to</span>'+
      '<input id="sendTo" type="email" inputmode="email" autocomplete="email" value="'+esc(PREFS.sendTo)+'" placeholder="name@company.com"></label>'+
      '<label class="row" style="gap:8px; align-items:center; margin-top:2px">'+
        '<input type="checkbox" id="saveSendTo" style="width:20px;min-height:20px;flex:none" checked>'+
        '<span class="note">Remember this address</span></label>'+
    '</div>'+
    '<div class="section"><div class="stack-sm">'+
      '<button class="btn btn-primary btn-block" id="shareBtn" data-act="do-share" style="display:none">'+svg("pic")+'<span class="lbl">Send with photos</span></button>'+
      '<a class="btn btn-solid btn-block" id="mailLink" data-act="do-email" href="'+esc(mailHref(w, PREFS.sendTo))+'">'+svg("mail")+'Open in my email app</a>'+
      '<button class="btn btn-ghost btn-block" data-act="do-copy">'+svg("copy")+'Copy the report</button>'+
      '<button class="btn btn-ghost btn-block" data-act="do-csv">'+svg("down")+'Save as a spreadsheet</button>'+
    '</div>'+
    '<p class="note" style="margin-top:9px">'+
      ((w.rooms.some(r => (r.photos||[]).length)) ? 'Photos can only go out through the share sheet \u2014 a plain email link can\'t carry attachments. ' : '')+
      'The report gets copied either way, so if your email app opens empty just paste it in.</p></div>'+
    '<div class="section"><span class="eyebrow">What gets sent</span>'+
      '<textarea id="reportText" readonly style="min-height:340px; font-size:13px; line-height:1.4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace">'+esc(report)+'</textarea>'+
    '</div>';
  $("#emailSheet").classList.add("on");
  document.body.style.overflow = "hidden";
  prepareShare(w);
  pushNav({ sheet: "email", screen: view.screen, wtId: view.wtId });
}
function mailHref(w, to){
  const report = buildReport(w);
  const subject = "Bid walkthrough — " + wtName(w);
  const short = report.length <= 1400;
  return "mailto:" + encodeURIComponent((to || "").trim()) +
    "?subject=" + encodeURIComponent(subject) +
    (short ? "&body=" + encodeURIComponent(report) : "");
}
function refreshMailHref(){
  const w = DB.walkthroughs.find(x => x.id === emailTarget); if (!w) return;
  const link = $("#mailLink"); if (!link) return;
  link.setAttribute("href", mailHref(w, $("#sendTo") ? $("#sendTo").value : PREFS.sendTo));
}
function hideEmailSheet(){
  $("#emailSheet").classList.remove("on");
  document.body.style.overflow = "";
  if (view.screen === "home") renderHome();
}
function closeEmailSheet(){
  if ($("#emailSheet").classList.contains("on")) navBack(); else hideEmailSheet();
}

function copyReport(){
  const ta = $("#reportText"); if (!ta) return false;
  try {
    ta.removeAttribute("readonly");
    ta.select(); ta.setSelectionRange(0, 999999);
    const ok = document.execCommand("copy");
    ta.setAttribute("readonly","readonly");
    if (ok) return true;
  } catch(e){}
  try {
    if (navigator.clipboard) { navigator.clipboard.writeText(ta.value); return true; }
  } catch(e){}
  return false;
}

function markSent(w){ w.sentAt = nowISO(); w.dirty = false; save(); }

function doEmail(){
  const w = DB.walkthroughs.find(x => x.id === emailTarget); if (!w) return;
  const to = ($("#sendTo") && $("#sendTo").value || "").trim();
  if ($("#saveSendTo") && $("#saveSendTo").checked){ PREFS.sendTo = to; savePrefs(); }
  const copied = copyReport();
  const short = buildReport(w).length <= 1400;
  markSent(w);
  toast(short ? "Opening your email app" : (copied ? "Report copied — paste it into the email" : "Copy the report below, then paste it in"));
}

/* ---------- spreadsheet ---------- */

function toCSV(rows){
  if (!rows.length) return "";
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (cols.indexOf(k) < 0) cols.push(k); }));
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  return cols.join(",") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(",")).join("\n");
}
function slug(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "walkthrough"; }

function exportCSV(scope){
  const list = scope === "all" ? DB.walkthroughs : DB.walkthroughs.filter(w => w.id === scope);
  const rows = [];
  list.forEach(w => w.rooms.forEach(r => rows.push(exportRow(w, r))));
  if (!rows.length){ toast("No rooms to export yet."); return; }
  const stamp = new Date().toISOString().slice(0,10);
  const name = (scope === "all" ? "busy-bidder-walkthroughs" : slug(wtName(list[0]))) + "-" + stamp + ".csv";
  if (saveFile(name, toCSV(rows), "text/csv")){
    if (scope !== "all" && list[0]) markSent(list[0]);
    toast("Saved");
  } else {
    toast("This browser wouldn't save the file. Copy the report instead.");
  }
}

/* ---------- backup and restore: the only way data moves between phones ---------- */

async function backupAll(){
  if (!DB.walkthroughs.length){ toast("Nothing to back up yet."); return; }
  toast("Building the backup…");
  const photos = {};
  for (const w of DB.walkthroughs){
    for (const r of w.rooms){
      for (const pid of (r.photos || [])){
        const rec = await getPhoto(pid);
        if (rec) photos[pid] = rec;
      }
    }
  }
  const payload = {
    app: "bid-walkthrough", version: 1, savedAt: nowISO(),
    walkthroughs: DB.walkthroughs, rates: RATES, fixmin: FIXMIN,
    glassmin: GLASSMIN, floorrate: FLOORRATE, prefs: PREFS,
    recent: RECENT, photos: photos
  };
  const name = "busy-bidder-backup-" + new Date().toISOString().slice(0,10) + ".json";
  toast(saveFile(name, JSON.stringify(payload), "application/json")
    ? "Backup saved" : "This browser wouldn't save the backup.");
}

async function restoreFrom(file){
  let data;
  try { data = JSON.parse(await file.text()); }
  catch(e){ toast("That file isn't a backup."); return; }
  if (!data || data.app !== "bid-walkthrough" || !Array.isArray(data.walkthroughs)){
    toast("That file isn't a backup from this app."); return;
  }
  const have = new Set(DB.walkthroughs.map(w => w.id));
  let added = 0;
  data.walkthroughs.forEach(w => { if (!have.has(w.id)){ DB.walkthroughs.push(w); added++; } });
  if (data.rates) RATES = Object.assign({}, DEFAULT_RATES, data.rates);
  if (data.fixmin) FIXMIN = Object.assign({}, DEFAULT_FIXTURE_MIN, data.fixmin);
  if (data.glassmin) GLASSMIN = Object.assign({}, DEFAULT_GLASS_MIN, data.glassmin);
  if (data.floorrate) FLOORRATE = Object.assign({}, DEFAULT_FLOOR_RATES, data.floorrate);
  if (data.prefs) PREFS = Object.assign({}, PREFS, data.prefs);
  if (data.recent && !Array.isArray(data.recent)) RECENT = Object.assign(RECENT, data.recent);
  else if (Array.isArray(data.recent)) RECENT.janitorial = data.recent;
  for (const pid in (data.photos || {})) await putPhoto(pid, data.photos[pid]);
  save(); saveRates(); savePrefs(); saveRecent();
  goHomeReplacing();
  toast(added ? added + " walkthrough" + (added > 1 ? "s" : "") + " restored" : "Everything in that backup was already here");
}
</script>

<script>
"use strict";

/* ============================ events ============================ */

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-go],[data-open],[data-act],[data-toggle],[data-type],[data-close],[data-eclose],[data-delphoto],.chip,.stp");
  if (!el) return;

  if (el.matches("[data-close]")){ closeTypeSheet(); return; }
  if (el.matches("[data-eclose]")){ closeEmailSheet(); return; }

  if (el.dataset.go){ go(el.dataset.go); return; }

  if (el.dataset.open){ go("wt", el.dataset.open); return; }

  if (el.dataset.toggle){
    view.openRoom = view.openRoom === el.dataset.toggle ? null : el.dataset.toggle;
    renderWT(); hydratePhotos();
    if (view.openRoom){
      const node = document.querySelector('[data-room="'+view.openRoom+'"]');
      if (node) node.scrollIntoView({ block:"nearest", behavior:"smooth" });
    }
    return;
  }

  if (el.dataset.type){
    const w = currentWT(); if (!w) return;
    const kind = kindOf(w);
    const r = kind === "window"
      ? newGlass(el.dataset.type)
      : newRoom(el.dataset.type, w.defaultFreq || DEFAULT_FREQ[kind]);
    w.rooms.push(r);
    RECENT[kind] = [el.dataset.type].concat((RECENT[kind]||[]).filter(x => x !== el.dataset.type)).slice(0,8);
    saveRecent(); touch(w);
    view.openRoom = r.id;
    hideTypeSheet(); navBack();
    renderWT(); hydratePhotos();
    const node = document.querySelector('[data-room="'+r.id+'"]');
    if (node) node.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }

  if (el.classList.contains("chip")){
    const group = el.closest("[data-chipgroup]"); if (!group) return;
    const w = currentWT(); if (!w) return;
    const key = group.dataset.chipgroup;
    const owner = group.dataset.rid;
    const val = el.dataset.val;

    if (key === "wtfreq"){
      const untouched = w.rooms.every(r => r.freq === (w.defaultFreq || "5"));
      w.defaultFreq = val;
      if (untouched) w.rooms.forEach(r => { r.freq = val; });
      repress(key, owner, val);
      touch(w);
      if (untouched){ w.rooms.forEach(r => patchRoom(r.id)); }
      patchFreqApply(); patchTotals();
      return;
    }

    const r = w.rooms.find(x => x.id === owner); if (!r) return;
    const STICKY = ["freq","sides","access","service"];
    const already = r[key] === val;
    r[key] = (STICKY.indexOf(key) >= 0) ? val : (already ? "" : val);
    repress(key, owner, r[key]);
    touch(w); patchRoom(r.id);
    if (key === "freq") patchFreqApply();
    return;
  }

  if (el.classList.contains("stp")){
    const cnt = el.closest("[data-cnt]");
    if (cnt){
      const w = currentWT(); const r = w && w.rooms.find(x => x.id === cnt.dataset.rid); if (!r) return;
      const key = cnt.dataset.cnt;
      const min = parseInt(cnt.dataset.min, 10) || 0;
      const next = Math.max(min, (parseInt(r[key], 10) || min) + parseInt(el.dataset.step, 10));
      r[key] = next;
      const box = cnt.querySelector(".fv");
      if (box) { if ("value" in box) box.value = next; else box.textContent = next; }
      touch(w); patchRoom(r.id);
      return;
    }
    const box = el.closest("[data-fix]"); if (!box) return;
    const w = currentWT(); const r = w && w.rooms.find(x => x.id === box.dataset.rid); if (!r) return;
    const key = box.dataset.fix;
    const next = Math.max(0, ((r.fixtures[key] || 0) + parseInt(el.dataset.step,10)));
    r.fixtures[key] = next;
    box.querySelector(".fv").textContent = next;
    touch(w); patchRoom(r.id);
    return;
  }

  if (el.dataset.delphoto){
    const w = currentWT(); const r = w && w.rooms.find(x => x.id === el.dataset.rid); if (!r) return;
    r.photos = (r.photos || []).filter(p => p !== el.dataset.delphoto);
    delPhoto(el.dataset.delphoto);
    const node = el.closest(".photo"); if (node) node.remove();
    touch(w); patchRoom(r.id);
    return;
  }

  const act = el.dataset.act;
  if (!act) return;

  if (act === "nav-back"){ navBack(); return; }
  if (act === "theme"){ cycleTheme(); return; }

  if (act === "check-update"){
    if (!("serviceWorker" in navigator)){ toast("This browser can't update in the background."); return; }
    toast("Checking…");
    navigator.serviceWorker.getRegistration()
      .then(reg => reg ? reg.update().then(() => {
        setTimeout(() => { if (!$("#updateBar").classList.contains("on")) toast("You're on the newest version"); }, 1500);
      }) : toast("Not stored offline yet — reload once with a connection."))
      .catch(() => toast("Couldn't check right now. Try again on wifi."));
    return;
  }

  if (act === "apply-freq"){
    const w = currentWT(); if (!w) return;
    const f = w.defaultFreq || "5";
    w.rooms.forEach(r => { r.freq = f; });
    touch(w); renderWT(); hydratePhotos();
    toast("Every room set to " + FREQ_LABEL[f]);
    return;
  }

  if (act === "new"){
    const w = newWalkthrough(el.dataset.kind);
    DB.walkthroughs.push(w); save();
    go("wt", w.id);
    setTimeout(() => { const f = $("#f-name"); if (f) f.focus({ preventScroll:true }); }, 80);
  }
  else if (act === "add-room") openTypeSheet();
  else if (act === "add-photo"){ photoTargetRoom = el.dataset.rid; $("#photoInput").click(); watchCameraLaunch(); }
  else if (act === "pick-photo"){ photoTargetRoom = el.dataset.rid; $("#photoPick").click(); }
  else if (act === "dup-room"){
    const w = currentWT(); const r = w && w.rooms.find(x => x.id === el.dataset.rid); if (!r) return;
    const copy = JSON.parse(JSON.stringify(r));
    copy.id = uid(); copy.photos = []; copy.label = "";
    w.rooms.splice(w.rooms.indexOf(r) + 1, 0, copy);
    touch(w); view.openRoom = copy.id; renderWT(); hydratePhotos();
  }
  else if (act === "del-room"){
    const w = currentWT(); const r = w && w.rooms.find(x => x.id === el.dataset.rid); if (!r) return;
    (r.photos || []).forEach(delPhoto);
    w.rooms.splice(w.rooms.indexOf(r), 1);
    touch(w); view.openRoom = null; renderWT(); hydratePhotos();
    toast("Room deleted");
  }
  else if (act === "del-wt"){
    const w = currentWT(); if (!w) return;
    if (!el.dataset.armed){
      el.dataset.armed = "1"; el.textContent = "Tap again to delete " + wtName(w);
      el.dataset.restore = "Delete this " + KINDS[kindOf(w)].noun;
      setTimeout(() => { if (el.isConnected){ el.dataset.armed = ""; el.textContent = el.dataset.restore || "Delete"; } }, 4000);
      return;
    }
    w.rooms.forEach(r => (r.photos || []).forEach(delPhoto));
    DB.walkthroughs = DB.walkthroughs.filter(x => x.id !== w.id);
    save(); goHomeReplacing(); toast("Deleted");
  }
  else if (act === "email"){ openEmailSheet(el.dataset.wtid || view.wtId); }
  else if (act === "do-email"){ doEmail(); }
  else if (act === "do-share"){ doShare(); }
  else if (act === "do-copy"){ toast(copyReport() ? "Report copied" : "Couldn't copy — select the text below instead"); }
  else if (act === "do-csv"){ exportCSV(emailTarget); }
  else if (act === "export-all"){ exportCSV("all"); }
  else if (act === "backup"){ await backupAll(); }
  else if (act === "restore"){ $("#restoreInput").click(); }
  else if (act === "reset-rates"){
    RATES = Object.assign({}, DEFAULT_RATES);
    FIXMIN = Object.assign({}, DEFAULT_FIXTURE_MIN);
    GLASSMIN = Object.assign({}, DEFAULT_GLASS_MIN);
    FLOORRATE = Object.assign({}, DEFAULT_FLOOR_RATES);
    saveRates(); renderSettings(); toast("Defaults restored");
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;

  if (el.id === "typeSearch"){ renderTypes(el.value); return; }

  if (el.dataset.wt){
    const w = currentWT(); if (!w) return;
    w[el.dataset.wt] = el.value;
    touch(w);
    if (el.dataset.wt === "name"){
      const h1 = $("#topbar").querySelector("h1");
      if (h1) h1.textContent = wtName(w);
    }
    return;
  }

  if (el.dataset.r){
    const w = currentWT(); const r = w && w.rooms.find(x => x.id === el.dataset.rid); if (!r) return;
    const key = el.dataset.r;
    r[key] = el.value;
    if (key === "len" || key === "wid"){
      if (kindOf(w) === "window"){
        const each = document.querySelector('[data-each="'+r.id+'"]');
        if (each) each.textContent = eachSqftText(r);
      } else {
        const l = parseFloat(r.len), wd = parseFloat(r.wid);
        if (!isNaN(l) && !isNaN(wd)){
          r.sqft = String(Math.round(l * wd));
          const box = document.querySelector('[data-r="sqft"][data-rid="'+r.id+'"]');
          if (box) box.value = r.sqft;
        }
      }
    }

    if (key === "label"){
      const node = document.querySelector('[data-room="'+r.id+'"] .room-title');
      if (node) node.textContent = roomLabel(w, r);
    }
    touch(w); patchRoom(r.id);
    return;
  }

  if (el.id === "prefSendTo"){ PREFS.sendTo = el.value.trim(); savePrefs(); return; }
  if (el.id === "sendTo"){ refreshMailHref(); return; }

  if (el.dataset.rate){
    const v = parseFloat(el.value);
    RATES[el.dataset.rate] = isNaN(v) ? DEFAULT_RATES[el.dataset.rate] : v;
    saveRates(); return;
  }
  if (el.dataset.fixmin){
    const v = parseFloat(el.value);
    FIXMIN[el.dataset.fixmin] = isNaN(v) ? DEFAULT_FIXTURE_MIN[el.dataset.fixmin] : v;
    saveRates(); return;
  }
  if (el.dataset.glassmin){
    const v = parseFloat(el.value);
    GLASSMIN[el.dataset.glassmin] = isNaN(v) ? DEFAULT_GLASS_MIN[el.dataset.glassmin] : v;
    saveRates(); return;
  }
  if (el.dataset.floorrate){
    const v = parseFloat(el.value);
    FLOORRATE[el.dataset.floorrate] = isNaN(v) ? DEFAULT_FLOOR_RATES[el.dataset.floorrate] : v;
    saveRates(); return;
  }
});

/* ---------- Android's back button ----------
   Every screen and sheet gets a history entry, so back steps one level inside the app
   instead of dropping the whole thing. Only back from the walkthrough list leaves. */

function pushNav(state){ try { history.pushState(state, ""); } catch(e){} }
function navBack(){ try { history.back(); } catch(e){ goHomeReplacing(); } }
function goHomeReplacing(){
  try { history.replaceState({ screen: "home" }, ""); } catch(e){}
  go("home", null, true);
}

window.addEventListener("popstate", (e) => {
  const st = (e && e.state) || { screen: "home" };
  if ($("#sheet").classList.contains("on")) hideTypeSheet();
  if ($("#emailSheet").classList.contains("on")) hideEmailSheet();
  if (st.sheet) return;
  go(st.screen || "home", st.wtId, true);
});

try { history.replaceState({ screen: "home" }, ""); } catch(e){}
go("home");

/* ---------- keep a copy of the app on the device so it opens with no signal ---------- */
let pendingWorker = null;
let reloadingForUpdate = false;

function offerUpdate(worker){
  pendingWorker = worker;
  const bar = $("#updateBar");
  if (bar) bar.classList.add("on");
}

if ("serviceWorker" in navigator){
  const btn = $("#updateNow");
  if (btn) btn.addEventListener("click", () => {
    btn.disabled = true; btn.textContent = "Updating…";
    if (pendingWorker) pendingWorker.postMessage({ type: "SKIP_WAITING" });
    else location.reload();
  });

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    location.reload();
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      const el = $("#offlineState");
      if (el) el.textContent = "Stored on this device — it opens with no signal.";

      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);

      reg.addEventListener("updatefound", () => {
        const fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener("statechange", () => {
          if (fresh.state === "installed" && navigator.serviceWorker.controller) offerUpdate(fresh);
        });
      });

      // Ask once per launch whether a newer build has been posted.
      setTimeout(() => { reg.update().catch(() => {}); }, 3000);
    }).catch(() => {
      const el = $("#offlineState");
      if (el) el.textContent = "Not stored offline. Serve the app over https and reload once with a connection.";
    });
  });
}
function paintOfflineState(){
  const el = $("#offlineState"); if (!el) return;
  if (!("serviceWorker" in navigator)){ el.textContent = "This browser can't store the app offline."; return; }
  navigator.serviceWorker.getRegistration().then(reg => {
    el.textContent = reg
      ? "Stored on this device — it opens with no signal."
      : "Not stored offline yet. Reload once while you have a connection.";
  }).catch(() => {});
}
